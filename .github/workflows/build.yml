name: Build and compatibility tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 1.20.1-R0.1-SNAPSHOT
            java: '17'
          - api: 1.20.6-R0.1-SNAPSHOT
            java: '21'
          - api: 1.21.11-R0.1-SNAPSHOT
            java: '21'
          - api: 26.2-R0.1-SNAPSHOT
            java: '25'
          - api: 26.3-R0.1-SNAPSHOT
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Save test runtime
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: bash gradlew build -PtestApi=${{ matrix.api }} -PtestJavaHome="$TEST_JAVA_HOME" --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.api }}
          path: |
            build/reports/tests/
            build/test-results/
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: ServerBootstrap
          path: |
            build/libs/*.jar
            build/distributions/*-offline.zip
