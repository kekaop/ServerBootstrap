config-version: 1
limits:
  max-download-bytes: 268435456
  max-extracted-bytes: 1073741824
  max-entries: 10000
  connect-timeout-seconds: 15
  download-timeout-seconds: 180
listener:
  enabled: false
  bind: "127.0.0.1"
  port: 8080
  # Set token-env only when the variable exists in the server process environment.
  # token-env: SERVERBOOTSTRAP_HTTP_TOKEN

# See docs/CONFIGURATION.md and examples/config.yml. New installations require a command.
# World replacement without external tools: docs/MAINTENANCE.md and examples/maintenance.yml.
profiles: {}
