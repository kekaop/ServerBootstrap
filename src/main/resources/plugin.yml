name: ServerBootstrap
version: '${version}'
main: dev.kekaop.ServerBootstrap.ServerBootstrap
api-version: '1.20'
load: STARTUP
prefix: ""

commands:
  setup-server:
    usage: /setup-server <profile>
    description: Install or update the bound server profile
  serverbootstrap:
    aliases: [sb]
    usage: /serverbootstrap help
    description: Validate, install and inspect server profiles

permissions:
  serverbootstrap.admin:
    description: Install profiles, request restarts and inspect bootstrap state
    default: false
