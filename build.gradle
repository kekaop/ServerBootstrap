plugins {
    id 'java'
}

group = 'dev.kekaop'
version = '2.1.0'
configurations { offlineRuntime }

repositories {
    mavenCentral()
    maven {
        name = "spigot-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    offlineRuntime 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation "org.spigotmc:spigot-api:${findProperty('testApi') ?: '1.20.1-R0.1-SNAPSHOT'}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    if (project.hasProperty('testJavaHome')) {
        executable = file("${project.property('testJavaHome')}/bin/java${System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''}")
    }
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}

tasks.register('offlineDist', Zip) {
    dependsOn jar
    archiveClassifier = 'offline'
    into('lib') { from tasks.jar; from configurations.offlineRuntime }
    from('scripts/offline.cmd', 'scripts/offline.sh')
    from('docs/OPERATIONS.md')
}
tasks.named('assemble') { dependsOn 'offlineDist' }

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.named('compileTestJava', JavaCompile) {
    if (project.hasProperty('testJavaHome')) {
        options.fork = true
        options.forkOptions.executable = "${project.property('testJavaHome')}/bin/javac${System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''}"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
